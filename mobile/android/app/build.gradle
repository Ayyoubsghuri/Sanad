plugins {
    id "com.android.application"
}

android {
    namespace "ma.sanad.app"
    compileSdk 34

    defaultConfig {
        applicationId "ma.sanad.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The interface is the web app (frontend/, built with `npm run build`) plus the phone's bridge and setup page (web-extra/).
def webAssets = layout.buildDirectory.dir("generated/webassets")
def frontendDist = rootProject.file("../../frontend/dist")
tasks.register("copyWeb", Copy) {
    doFirst {
        if (!new File(frontendDist, "index.html").exists())
            throw new GradleException("Build the interface first: cd frontend && npm ci --legacy-peer-deps && npm run build")
    }
    from(frontendDist) { exclude "assets/aistudio/**" }
    from(rootProject.file("web-extra"))
    into(webAssets.map { it.dir("web") })
}
android.sourceSets.main.assets.srcDirs += webAssets
preBuild.dependsOn("copyWeb")
