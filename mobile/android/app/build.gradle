plugins {
    id "com.android.application"
}

// The release key (GitHub secret ANDROID_KEYSTORE_BASE64, decoded by the workflow into SANAD_KEYSTORE): every APK signed with
// the same key installs over the previous one. Without it the build is signed with a throw-away debug key (fresh install needed).
def releaseKeystore = System.getenv("SANAD_KEYSTORE")
// Always growing (minutes since 2023-03-27), so each new build is an update and never a downgrade, whichever workflow made it.
def autoVersionCode = (System.getenv("SANAD_VERSION_CODE") ?: String.valueOf((int) (System.currentTimeMillis() / 60000L - 28_000_000L))).toInteger()

android {
    namespace "ma.sanad.app"
    compileSdk 34

    defaultConfig {
        applicationId "ma.sanad.app"
        minSdk 26
        targetSdk 34
        versionCode autoVersionCode
        versionName (System.getenv("SANAD_VERSION_NAME") ?: "0.2")
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SANAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SANAD_KEY_ALIAS") ?: "sanad"
                keyPassword System.getenv("SANAD_KEY_PASSWORD") ?: System.getenv("SANAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/INDEX.LIST",
                         "META-INF/versions/9/OSGI-INF/MANIFEST.MF", "META-INF/*.version"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.anthropic:anthropic-java:3.8.0"   // Claude answers (Claude.java)
}

// The interface is the web app (frontend/, built with `npm run build`) plus the phone's bridge and setup page (web-extra/).
def webAssets = layout.buildDirectory.dir("generated/webassets")
def frontendDist = rootProject.file("../../frontend/dist")
tasks.register("copyWeb", Copy) {
    doFirst {
        if (!new File(frontendDist, "index.html").exists())
            throw new GradleException("Build the interface first: cd frontend && npm ci --legacy-peer-deps && npm run build")
    }
    from(frontendDist) { exclude "assets/aistudio/**" }
    from(rootProject.file("web-extra"))
    into(webAssets.map { it.dir("web") })
}
android.sourceSets.main.assets.srcDirs += webAssets
preBuild.dependsOn("copyWeb")
