name: Release

# Builds the Windows installers (SanadSetup-<version>.exe, Sanad-<version>.msi) and the Android app (Sanad-<version>.apk),
# and publishes them together as the GitHub Release v<version>, with installer/RELEASE_NOTES.md as its text.
#   - a change of installer/VERSION on main (or a pushed tag like v0.2.0) builds and publishes
#   - run by hand (Actions > Release > Run workflow): the files are attached to the run; tick "publish" to also publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the GitHub Release v<installer/VERSION>"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["installer/VERSION"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d '[:space:]' < installer/VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS, wixl and the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis wixl gcc-mingw-w64-x86-64
      - name: Build the installers
        run: installer/build.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/out/*.exe
            installer/out/*.msi

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the interface
        working-directory: frontend
        run: npm ci --legacy-peer-deps && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        working-directory: mobile/android
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p ../../apk-out
          cp app/build/outputs/apk/debug/app-debug.apk "../../apk-out/Sanad-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apk-out/*.apk

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd out && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          sed "s/{version}/${{ needs.version.outputs.version }}/g" installer/RELEASE_NOTES.md > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-${{ needs.version.outputs.version }}
          path: out/*
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sanad ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: out/*
          make_latest: true
