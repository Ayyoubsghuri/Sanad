name: Windows installers

# Builds SanadSetup-<version>.exe and Sanad-<version>.msi.
#   - run it by hand (Actions > Windows installers > Run workflow): the two files are attached to the run as an artifact
#   - push a tag like v0.1.0: the two files are also published as a GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS and wixl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis wixl
      - name: Build the installers
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then installer/build.sh "${GITHUB_REF_NAME#v}"; else installer/build.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-windows-installers
          path: installer/out/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/out/*
          generate_release_notes: true
