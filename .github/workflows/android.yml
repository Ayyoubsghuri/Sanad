name: Android APK

on:
  push:
    branches: [main, android-app]
    paths: ["mobile/android/**", "frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the interface (frontend/dist, bundled into the app)
        working-directory: frontend
        run: npm ci --legacy-peer-deps && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sanad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish the APK on the Releases page (tag android-latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sanad for Android (latest build)
          prerelease: true
          make_latest: false
          body: "Install on your Android phone: download Sanad.apk, open it, allow installing from this source. Built from branch ${{ github.ref_name }}, commit ${{ github.sha }}."
          files: mobile/android/app/build/outputs/apk/debug/Sanad.apk
