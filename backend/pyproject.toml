[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag-backend"
version = "0.1.0"
description = "FastAPI backend for the Moroccan Legal RAG: date-aware retrieval, verified citations, local pseudonymisation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "langchain-core>=0.3",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
  "keyring>=25",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",   # page images of the official PDF + the bundled extractor
  "pikepdf>=9.0",
  "fonttools>=4.40",   # the Bulletin Officiel extractor repairs Arabic glyphs from the embedded fonts
  "pypdfium2>=4.0",    # its ink-coverage audit and hidden-text filter
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=3.0"]   # BGE-M3 embedder + bge-reranker-v2-m3
desktop = ["pywebview>=5.3"]   # Sanad in its own window (legalrag.desktop); uses the WebView2 runtime of Windows 10/11
ner = ["transformers>=4.40", "torch>=2.2"]   # Arabic PII NER (MutazYoune/Arabic-NER-PII)
ocr = ["pytesseract>=0.3", "pillow>=10"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
legalrag = "legalrag.main:run"
legalrag-build = "legalrag.builder.cli:main"
legalrag-eval = "legalrag.evalharness.cli:main"

[tool.setuptools.packages.find]
include = ["legalrag*"]

[tool.setuptools.package-data]
legalrag = ["data/*.json", "bo_pipeline/*.py", "bo_pipeline/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
